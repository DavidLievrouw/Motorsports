services:
  nginx:
    image: motorsports:latest
    container_name: motorsports
    restart: unless-stopped
    environment:
      - ConnectionStrings__Motorsports=${MOTORSPORTS_CONNECTION_STRING:?Set MOTORSPORTS_CONNECTION_STRING in your environment}
      - Kestrel:Endpoints:Http:Url=http://0.0.0.0:80
    networks:
      - motorsports_network

networks:
  motorsports_network:
    name: motorsports_net
    external: true