services:
  mariadb:
    image: mariadb:12.3.3
    hostname: mariadb
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: S3cr37_4321
      MARIADB_USER: motorsports
      MARIADB_PASSWORD: S3cr37_1234
      MARIADB_DATABASE: motorsports
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"
    logging:
      options:
        max-size: "25m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mariadb_data:
    driver: local
