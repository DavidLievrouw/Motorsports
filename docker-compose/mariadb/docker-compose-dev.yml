services:
  mariadb:
    image: mariadb:11.7
    hostname: mariadb
    container_name: mariadb
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in your environment}
      - MARIADB_USER=${MARIADB_USER:-motorsports}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in your environment}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-motorsports}
    volumes:
      - ./motorsports_db:/var/lib/mysql
    ports:
      - "3306:3306"
    logging:
      options:
        max-size: "25m"
        max-file: "3"  
    deploy:
      resources:
        limits:
          memory: 512M
