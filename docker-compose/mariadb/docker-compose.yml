services:
  mariadb:
    image: mariadb:12.3.3
    hostname: mariadb
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in your environment}
      MARIADB_USER: motorsports
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in your environment}
      MARIADB_DATABASE: motorsports
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - /etc/dalion/motorsports/mariadb:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - motorsports_network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  motorsports_network:
    name: motorsports_net
    external: true
